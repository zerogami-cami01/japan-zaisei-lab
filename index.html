<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>令和5年度 地方自治体決算ターミナル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css?v=5">
</head>
<body>

  <!-- TOPBAR -->
  <header id="topbar">
    <div class="topbar-logo">JAPAN ZAISEI LAB</div>
    <div style="width:1px;height:20px;background:var(--border-accent)"></div>
    <div class="topbar-title">地方自治体決算ターミナル</div>
    <div class="topbar-subtitle">令和5年度（2023年度）</div>
    <div class="topbar-spacer"></div>
    <button id="importBtn" class="topbar-import-btn">&#8659; データ読込</button>
    <div class="topbar-badge">R5 KESSAN</div>
  </header>

  <!-- IMPORT MODAL -->
  <div id="importModal" class="import-modal-overlay" hidden>
    <div class="import-modal">
      <div class="import-modal-header">
        <span class="import-modal-title">&#8659; Excel データ読込</span>
        <span class="import-modal-sub">総務省「市町村別決算状況調」</span>
        <button id="importClose" class="import-close">&#10005;</button>
      </div>

      <div class="import-unit-row">
        <span class="import-label">金額単位:</span>
        <label><input type="radio" name="unit" value="千円" checked> 千円</label>
        <label><input type="radio" name="unit" value="万円"> 万円</label>
        <label><input type="radio" name="unit" value="百万円"> 百万円</label>
      </div>

      <div class="import-files">
        <div class="import-file-row">
          <div class="import-file-label"><span class="import-num">(1)</span> 概況</div>
          <label class="import-file-btn">
            ファイルを選択
            <input type="file" id="file-gaikyo" accept=".xlsx,.xls" multiple>
          </label>
          <span class="import-file-names" id="name-gaikyo">未選択</span>
        </div>
        <div class="import-file-row">
          <div class="import-file-label"><span class="import-num">(2)</span> 歳入内訳</div>
          <label class="import-file-btn">
            ファイルを選択
            <input type="file" id="file-sainyu" accept=".xlsx,.xls" multiple>
          </label>
          <span class="import-file-names" id="name-sainyu">未選択</span>
        </div>
        <div class="import-file-row">
          <div class="import-file-label"><span class="import-num">(3)</span> 目的別歳出</div>
          <label class="import-file-btn">
            ファイルを選択
            <input type="file" id="file-mokuteki" accept=".xlsx,.xls" multiple>
          </label>
          <span class="import-file-names" id="name-mokuteki">未選択</span>
        </div>
        <div class="import-file-row">
          <div class="import-file-label"><span class="import-num">(4)</span> 性質別歳出</div>
          <label class="import-file-btn">
            ファイルを選択
            <input type="file" id="file-seishitsu" accept=".xlsx,.xls" multiple>
          </label>
          <span class="import-file-names" id="name-seishitsu">未選択</span>
        </div>
      </div>

      <div id="importLog" class="import-log" hidden></div>

      <div class="import-modal-footer">
        <button id="importRun" class="import-run-btn">読み込む</button>
        <span id="importStatus" class="import-status"></span>
      </div>
    </div>
  </div>

  <!-- BACKBAR (detail view) -->
  <div id="backbar">
    <button id="backBtn">&#9664; 一覧に戻る</button>
  </div>

  <!-- SEARCHBAR -->
  <div id="searchbar">
    <span class="search-prompt">&#62; 検索:</span>
    <input id="searchInput" type="text" placeholder="自治体名・都道府県名で検索...">
    <span id="searchCount"></span>
  </div>

  <!-- FILTERBAR -->
  <div id="filterbar"></div>

  <!-- MAIN CONTENT -->
  <main id="main">

    <!-- LOADING -->
    <div id="panel-loading" class="panel active">
      <div class="loading-spinner">▌</div>
      <div class="loading-text">データ読み込み中...</div>
    </div>

    <!-- EMPTY -->
    <div id="panel-empty" class="panel">
      <div class="empty-icon">[ 404 ]</div>
      <div class="empty-text">自治体が見つかりません</div>
    </div>

    <!-- BROWSE -->
    <div id="panel-browse" class="panel">
      <div class="view-controls">
        <button class="view-btn active" data-view="grid">&#9632;&#9632; グリッド</button>
        <button class="view-btn" data-view="compact">&#9632;&#9632;&#9632; コンパクト</button>
        <button class="view-btn" data-view="list">&#8801; リスト</button>
      </div>
      <div id="entityGrid" class="entity-grid"></div>
    </div>

    <!-- DETAIL -->
    <div id="panel-detail" class="panel"></div>

  </main>

  <!-- FOOTER -->
  <footer id="footer">
    <span class="footer-text">出典：総務省「令和5年度 市町村別決算状況調」</span>
    <span class="footer-text">|</span>
    <a class="footer-link" href="https://www.soumu.go.jp/iken/kessan_jokyo_1.html" target="_blank" rel="noopener">
      総務省データソース
    </a>
    <div style="flex:1"></div>
    <span class="footer-text">&copy; 2024 Japan Zaisei Lab</span>
  </footer>

  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <!-- SheetJS (Excel読み込み) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- App (通常スクリプト — htmlpreview.github.io対応) -->
  <script src="src/data.js?v=5"></script>
  <script src="src/components.js?v=5"></script>
  <script src="src/importer.js?v=5"></script>
  <script src="src/main.js?v=5"></script>

</body>
</html>
